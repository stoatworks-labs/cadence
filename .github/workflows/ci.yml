name: ci

# macOS only, and deliberately. The CMakeLists branches on APPLE and WIN32 and
# has no Linux path at all, so ubuntu is not an option; Windows needs GLEW from
# vcpkg, which is a slow, fragile thing to put in front of every pull request
# for a compile break that would almost certainly show up on macOS too. The
# release workflow still builds both.
#
# Without a workflow carrying a `pull_request` trigger a Dependabot bump has no
# status check to gate a merge on, and they simply accumulate.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
        with:
          # The FFGL SDK is a submodule. Without this CMake fails at configure
          # time with a missing-directory error that reads like a broken repo.
          submodules: recursive

      - name: Configure
        # arm64 only, unlike the release build's universal arm64;x86_64 -- the
        # second slice doubles the build for no extra signal, because a source
        # break is not architecture-specific. Passed as a single value with no
        # semicolon, which the shell would split.
        #
        # CADENCE_BUILD_TOOLS is ON here where the release build turns it OFF:
        # cdtest is where every claim this plugin makes is actually asserted,
        # so compiling it is most of the value of the job.
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DCADENCE_BUILD_TOOLS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      # The checks that need no GPU. A GitHub macOS runner has no accelerated
      # GL context, so everything that renders is deliberately left out: a red
      # build that only means "no GPU here" is a red build people learn to
      # ignore. tools/verify.sh runs all of them locally, and that is where
      # the picture-level checks belong.
      #
      # --list needs no context at all: it is answered before one is created,
      # which is exactly why it is the check that can run here. It proves the
      # parameter block is well-formed and that the About text parameter has
      # not gone missing.
      - name: Checks that need no GPU
        run: |
          ./build/cdtest --list
          ./build/cdtest --list | grep -q "Adaptive Threshold"
          ./build/cdtest --list | grep -q "about"

      # Uploading is not only for the artefact. This repo has no package
      # manifest, so github-actions is its only Dependabot ecosystem -- and a
      # bump to actions/upload-artifact otherwise touches release.yml alone,
      # a workflow no pull request ever runs. Using it here means the check
      # actually exercises the action being bumped.
      - uses: actions/upload-artifact@v7
        with:
          name: cadence-macos-arm64
          path: build/*.bundle
          if-no-files-found: error
