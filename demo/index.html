  <body>
    <main id="demo">
      <noscript>
        <h1>Cadence</h1>
        <p>
          An FFGL effect built on one rule: a field is a slice of time as well
          as a slice of lines. Combing, bob bounce, ghosting, 3:2 judder and a
          mis-locked inverse telecine all follow from that rule, so they aren't
          five separate effects, and there's no table of cadences anywhere in
          the source.
        </p>
        <p>
          This demo runs the plugin's shaders in your browser, so it needs
          JavaScript and WebGL2. The plugin itself, its source and its downloads
          are on
          <a href="https://github.com/stoatworks-labs/cadence">its repository</a>.
        </p>
        <ul>
          <li><a href="https://stoatworks-labs.com/software/cadence/">Project page and downloads</a></li>
          <li><a href="https://github.com/stoatworks-labs/cadence">Source on GitHub</a></li>
        </ul>
      </noscript>
    </main>
